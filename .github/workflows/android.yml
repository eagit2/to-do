name: Android build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: todo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Room writes its schema JSON on every build. A changed or new file means the database
      # changed without its schema (and migration test inputs) being committed.
      - name: Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed. Commit the files below."
            git status --porcelain app/schemas
            for f in $(git ls-files --others --modified app/schemas); do echo "=== $f"; cat "$f"; echo; done
            exit 1
          fi
